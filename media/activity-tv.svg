<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440" width="440" height="440">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4e4e4"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6a55"/>
      <stop offset="1" stop-color="#f74130"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000" flood-opacity="0.14"/>
    </filter>
  </defs>
  <!-- antenna -->
  <path d="M160 92 L215 150 M280 92 L225 150" stroke="#b9b9b9" stroke-width="12" stroke-linecap="round" fill="none"/>
  <circle cx="160" cy="92" r="11" fill="#9d9d9d"/>
  <circle cx="280" cy="92" r="11" fill="#9d9d9d"/>
  <!-- stand -->
  <rect x="130" y="354" width="40" height="30" rx="10" fill="#bdbdbd"/>
  <rect x="270" y="354" width="40" height="30" rx="10" fill="#bdbdbd"/>
  <!-- body -->
  <g filter="url(#sh)">
    <rect x="52" y="140" width="336" height="222" rx="52" fill="url(#body)"/>
  </g>
  <!-- screen -->
  <rect x="84" y="170" width="212" height="162" rx="30" fill="url(#screen)"/>
  <path d="M104 196 q40 -14 84 -10" stroke="#ffffff" stroke-opacity="0.45" stroke-width="10" stroke-linecap="round" fill="none"/>
  <!-- play -->
  <path d="M168 224 L168 280 L216 252 Z" fill="#ffffff" stroke="#ffffff" stroke-width="12" stroke-linejoin="round"/>
  <!-- knobs -->
  <circle cx="341" cy="214" r="17" fill="#a8a8a8"/>
  <circle cx="341" cy="268" r="17" fill="#a8a8a8"/>
  <rect x="326" y="302" width="30" height="10" rx="5" fill="#c9c9c9"/>
</svg>
